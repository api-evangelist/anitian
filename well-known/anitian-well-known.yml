x-notes:
  - >-
    TRAP for re-runs: www.anitian.com runs WordPress with
    `redirect_guess_404_permalink` enabled, so a single-word path that does not
    exist is 302'd to a fuzzy-matched blog post and answers 200. /security 200s
    to a podcast episode, /trust 200s to a 2019 blog post, /compliance 200s to a
    product brief. A 200 on those paths is NOT a security policy, trust center,
    or compliance page. The control path /this-path-does-not-exist-control
    returns 404, and /responsible-disclosure, /vulnerability-disclosure and
    /security-policy all return 404 — Anitian publishes none of them. The
    automated security-programs probe produced a vulnerability-disclosure and a
    trust-center file from these fuzzy hits; both were verified false and deleted.

