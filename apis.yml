apis:
- aid: anitian:securecloud-platform
  name: Anitian SecureCloud / FedFlex Platform API
  description: 'The HTTP API behind the Anitian SecureCloud and FedFlex console at
    securecloud.anitian.com. Anitian documents (in its FedRAMP 20x pilot README) that
    "an API is available for auditors to download evidence and integrate it into their
    own systems", but publishes no OpenAPI, reference, or developer portal. Every probed
    path under the console — including /openapi.json, /swagger.json, /api-docs and /docs
    — returns HTTP 307 to /auth/signin. Two endpoints answer anonymously and confirm the
    surface is live: /api/health returns {"status":"ok"} and /api/auth/providers enumerates
    the OAuth identity providers (Okta and Amazon Cognito). Access is customer- and
    auditor-only.'
  humanURL: https://securecloud.anitian.com/
  baseURL: https://securecloud.anitian.com/api
  tags:
  - Compliance
  - Security
  - Audit
  - Evidence
  properties:
  - type: Login
    url: https://securecloud.anitian.com/auth/signin
  x-evidence:
    fetched: '2026-08-06'
    probes:
    - url: https://securecloud.anitian.com/api/health
      status: 200
      note: 'anonymous; body {"status":"ok","version":""}'
    - url: https://securecloud.anitian.com/api/auth/providers
      status: 200
      note: anonymous; NextAuth provider list — okta, cognito
    - url: https://securecloud.anitian.com/openapi.json
      status: 307
      note: redirects to /auth/signin
    - url: https://securecloud.anitian.com/api-docs
      status: 307
      note: redirects to /auth/signin
- aid: anitian:fedflex-copilot
  name: Anitian FedFlex Copilot WebSocket API
  description: 'An AWS API Gateway WebSocket API fronting the FedFlex agentic-AI copilot.
    Every plain HTTP request to copilot.anitian.com returns HTTP 426 Upgrade Required
    with a Sec-WebSocket-Version: 13 header; a WebSocket upgrade handshake is answered
    by the $connect authorizer with HTTP 401 {"message":"Unauthorized"}. No AsyncAPI,
    message catalog, or public documentation of the protocol is published.'
  humanURL: https://www.anitian.com/fedflex-platform-overview/
  baseURL: https://copilot.anitian.com
  tags:
  - Artificial Intelligence
  - Agents
  - Compliance
  tags_raw:
  - AI
  - Agents
  - Compliance
  x-evidence:
    fetched: '2026-08-06'
    probes:
    - url: https://copilot.anitian.com/
      status: 426
      note: 'Sec-WebSocket-Version: 13; AWS API Gateway (execute-api us-west-2)'
    - url: https://copilot.anitian.com/
      status: 401
      note: WebSocket upgrade handshake rejected by $connect authorizer
