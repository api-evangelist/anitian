  reason: customer-only-docs
  detail: >-
    Anitian's own FedRAMP 20x README says an API exists for auditors to download
    evidence, but the SecureCloud/FedFlex console at securecloud.anitian.com answers
    HTTP 307 to /auth/signin for every path including /openapi.json and /api-docs —
    only /api/health and the NextAuth /api/auth/* endpoints respond anonymously — and
    the FedFlex copilot API at copilot.anitian.com is a WebSocket-only AWS API Gateway
    whose $connect route returns 401, so no contract is reachable without a tenant or
    auditor account.
