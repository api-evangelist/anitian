aid: anitian
name: Anitian
description: 'Anitian, Inc. is a Portland, Oregon cloud security and compliance automation
  company that helps SaaS providers reach and maintain U.S. federal compliance. Its
  FedFlex platform automates the FedRAMP lifecycle — pre-engineered AWS and Azure landing
  zones, AI-driven evidence collection mapped to FedRAMP 20x Key Security Indicators
  (KSIs) and NIST 800-53 controls, SSP generation, an auditor view for 3PAOs, and continuous
  monitoring — sold as FedFlex Starter (FedRAMP Low via the sponsorless 20x pilot) and
  FedFlex Comprehensive (Moderate/High). Anitian also sells SecureCloud compliance automation
  for ISO 27001, CMMC and commercial frameworks, plus managed SecOps. The company published
  a machine-readable FedRAMP 20x Phase One pilot package — a KSI-aligned assessment file,
  its data schema, and a signed 3PAO attestation from A-LIGN — publicly on GitHub. Anitian
  merged with Arkenstone Defense in April 2026 and now operates as "Anitian, powered by
  Arkenstone".'
